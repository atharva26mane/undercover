<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3cf">
<title>Undercover</title>
<style>
:root{--bg:#fff3cf;--ink:#1d1147;--mute:#6b6394;--card:#fff;--violet:#7c4dff;--pink:#ff4f9a;--yellow:#ffd23f;--teal:#12b5a0;--orange:#ff7a2f;--blue:#3d8bff;--green:#27b866;--red:#e8384f;--lav:#efe9ff;--line:#e4dcff;--sh:0 4px 0 var(--ink);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:600 16px/1.4 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 8% 0,#ffe08a 0,transparent 42%),radial-gradient(circle at 100% 18%,#ffc2dd 0,transparent 38%),var(--bg);background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#wrap{max-width:520px;margin:0 auto;padding:12px 14px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;min-height:40px}
.logo{background:var(--violet);color:#fff;border:3px solid var(--ink);padding:4px 13px;border-radius:999px;font-weight:900;letter-spacing:.1em;font-size:13px;text-transform:uppercase;box-shadow:0 3px 0 var(--ink)}
.hdr-r{display:flex;gap:8px;align-items:center}
.chip{background:var(--yellow);border:3px solid var(--ink);color:var(--ink);border-radius:999px;padding:4px 13px;font:inherit;font-weight:900;letter-spacing:.14em;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.link{background:none;border:0;color:var(--ink);font:inherit;font-size:14px;font-weight:800;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
h1{font-size:36px;line-height:1.05;margin:14px 0 6px;letter-spacing:-.02em;font-weight:900}
h2{font-size:13px;margin:0 0 10px;color:var(--violet);font-weight:900;text-transform:uppercase;letter-spacing:.1em}
p{margin:6px 0}
.sub{color:var(--mute);margin:0 0 16px;font-size:16px}
.hero{text-align:center;padding:6px 0 4px}.hero-emoji{font-size:58px;line-height:1;filter:drop-shadow(0 4px 0 rgba(29,17,71,.2))}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:15px;margin-bottom:16px;box-shadow:var(--sh)}
input[type=text],input[type=number]{width:100%;background:#fff;border:3px solid var(--ink);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:18px;font-weight:700;outline:none}
input:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(124,77,255,.25)}
input::placeholder{color:#a79fc9}
input.code{text-transform:uppercase;letter-spacing:.35em;text-align:center;font-weight:900;font-size:26px}
.btn{display:block;width:100%;min-height:54px;border:3px solid var(--ink);border-radius:16px;font:inherit;font-size:17px;font-weight:900;padding:11px 16px;background:#fff;color:var(--ink);box-shadow:var(--sh);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--yellow)}
.btn.violet{background:var(--violet);color:#fff}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red);box-shadow:0 4px 0 var(--red)}
.btn.small{min-height:40px;font-size:14px;padding:6px 12px;width:auto;display:inline-block;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.small.danger{box-shadow:0 3px 0 var(--red)}
.btn[disabled]{opacity:.4;box-shadow:none;transform:none}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row.wrap{flex-wrap:wrap}
.gap{height:12px}
.mute{color:var(--mute)}
.err{color:var(--red);font-weight:800}
.center{text-align:center}
.bigcode{font-size:60px;font-weight:900;letter-spacing:.2em;text-align:center;padding-left:.2em;color:var(--violet);text-shadow:3px 3px 0 var(--yellow)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:2px dashed var(--line)}
.plist li:first-child{border-top:0}
.plist li.hl{background:#ffe9a8;border-radius:12px;padding-left:6px;padding-right:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.dot.off{background:#c3bcd9}
.av{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff;font-weight:900;font-size:18px;text-shadow:0 2px 0 rgba(29,17,71,.45)}
.av.sm{width:30px;height:30px;font-size:14px;border-width:2px}
.pname{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname.dead{text-decoration:line-through;color:var(--mute)}
.tag{font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px;background:#fff;border:2px solid var(--ink);color:var(--ink);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tag.civ,.tag.ok{background:#c8f6dc}.tag.und{background:#ffd0d6}.tag.wht{background:#fff;border-style:dashed}
.pts{font-size:12px;font-weight:900;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:2px 9px;white-space:nowrap}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:2px dashed var(--line)}
.set:first-of-type{border-top:0}
.set .lbl{flex:1;font-weight:800}.set .lbl small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.step{display:flex;align-items:center;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.step button{width:44px;height:42px;background:var(--lav);border:0;color:var(--ink);font:inherit;font-size:24px;font-weight:900}
.step button:active{background:var(--yellow)}
.step span{min-width:46px;text-align:center;font-weight:900;font-size:19px}
.sw{position:relative;width:56px;height:32px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2}
.sw i{position:absolute;inset:0;background:#fff;border:3px solid var(--ink);border-radius:999px;transition:.15s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:.15s}
.sw input:checked+i{background:var(--teal)}
.sw input:checked+i:after{left:27px;background:#fff;border:2px solid var(--ink)}
.timer{text-align:center;margin-bottom:14px}
.timer b{font-size:60px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:16px;background:#fff;border:3px solid var(--ink);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--teal);width:100%;transition:width .25s linear}
.bar>div.low{background:var(--red)}
.word{display:block;width:100%;text-align:center;border:3px dashed var(--ink);background:#fff;color:var(--mute);border-radius:22px;padding:18px;font:inherit;font-size:16px;font-weight:800;margin-bottom:16px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.word.show{border-style:solid;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;box-shadow:var(--sh)}
.word .big{display:block;font-size:40px;font-weight:900;color:var(--yellow);margin-top:4px;word-break:break-word;text-shadow:0 3px 0 rgba(29,17,71,.35)}
.word small{display:block;opacity:.9;font-weight:700;margin-top:4px}
.banner{border-radius:18px;padding:13px 15px;margin-bottom:14px;font-weight:800;background:var(--yellow);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.banner.bad{background:#ffd0d6}.banner.ok{background:#c8f6dc}
.desc{display:flex;gap:8px;padding:8px 0;border-top:2px dashed var(--line)}
.desc:first-child{border-top:0}.desc b{min-width:86px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.desc span{flex:1;word-break:break-word}
.vbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;min-height:58px;padding:9px 14px;margin-bottom:10px;border-radius:18px;border:3px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-size:17px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.vbtn:active{transform:translateY(3px);box-shadow:none}
.vbtn.sel{background:#ffe9a8;transform:translateY(3px);box-shadow:none}
.vbtn .vl{display:flex;align-items:center;gap:10px;min-width:0}
.vbtn small{color:var(--mute);font-weight:700;font-size:12px;text-align:right}
.result{text-align:center;padding:22px 14px}
.result .who{font-size:34px;font-weight:900;margin:4px 0}
.result .what{font-size:22px;font-weight:900;color:var(--violet)}
.result .w{font-size:18px;color:var(--mute);margin-top:6px}
.sup-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:2px dashed var(--line);align-items:center}
.sup-row:first-child{border-top:0}.sup-row .w{color:var(--violet);font-weight:900}.sup-row .d{grid-column:1/3;color:var(--mute);font-size:14px}
details{margin-top:8px}summary{color:var(--ink);cursor:pointer;padding:6px 0;font-weight:800}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.chipbtn{display:flex;align-items:center;gap:9px;min-height:62px;border:3px solid var(--ink);border-radius:18px;background:#fff;padding:8px 10px;font:inherit;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--ink);text-align:left;color:var(--ink)}
.chipbtn:active{transform:translateY(3px);box-shadow:none}
.chipbtn.done{background:#d3f8e3}
.chipbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipbtn .ck{font-size:19px;color:var(--green)}
.rrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:2px dashed var(--line)}
.rrow:first-child{border-top:0}
.rno{width:20px;text-align:center;color:var(--mute);font-weight:900;font-size:14px;flex:none}
.rname{flex:1;min-width:0;background:none;border:0;font:inherit;font-weight:800;font-size:17px;text-align:left;color:var(--ink);padding:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.redit{padding:7px 10px!important;font-size:17px!important;border-radius:12px!important;flex:1;min-width:0}
.rx{border:3px solid var(--ink);background:#ffd0d6;border-radius:12px;width:40px;height:40px;font:inherit;font-weight:900;font-size:16px;color:var(--ink);flex:none}
.rx:active{background:var(--red);color:#fff}
.addrow{display:flex;gap:10px;margin-top:12px}.addrow input{flex:1}.addrow .btn{width:auto;min-height:50px;padding:8px 18px}
.mode h2{display:flex;align-items:center;gap:8px}
.mode-ic{display:inline-flex;width:34px;height:34px;border-radius:12px;border:3px solid var(--ink);align-items:center;justify-content:center;font-size:18px}
.overlay{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,var(--violet),var(--pink));display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease-out}
.ov-in{width:100%;max-width:440px;text-align:center;color:#fff}
.ov-hi{font-size:36px;font-weight:900;margin-bottom:2px;text-shadow:0 3px 0 rgba(29,17,71,.35)}
.ov-in .mute{color:rgba(255,255,255,.9);margin-bottom:16px}
.overlay .word.show{background:#fff;color:var(--ink);border-width:3px}
.overlay .word .big{color:var(--violet);text-shadow:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;text-align:center}
#toast.on{opacity:1}
#net{position:fixed;top:0;left:0;right:0;background:var(--red);color:#fff;text-align:center;font-weight:900;padding:7px;font-size:14px;z-index:60;display:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#app>*{animation:rise .24s ease-out}
@media (prefers-reduced-motion:reduce){#app>*,.overlay{animation:none}.btn,.vbtn,.chipbtn{transition:none}}
</style>

<body>
<div id="net">Reconnecting…</div>
<div id="wrap"><header id="hdr"></header><main id="app"></main></div>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  /* ---------- tiny DOM helper (always textContent, never innerHTML) ---------- */
  function h(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (k === 'value' || k === 'checked' || k === 'disabled') e[k] = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
    return e;
  }
  function add(e, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(function (x) { add(e, x); });
    else e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }
  function fill(e) { clear(e); for (var i = 1; i < arguments.length; i++) add(e, arguments[i]); return e; }

  /* ---------- state + storage ---------- */
  var PAL = ['#7c4dff', '#ff4f9a', '#12b5a0', '#ff7a2f', '#3d8bff', '#27b866', '#e8384f', '#a65cff', '#0ea5c6', '#d99a00'];
  function avatar(name, i, cls) {
    var ch = Array.from(String(name).trim())[0] || '?';
    return h('span', { class: 'av' + (cls ? ' ' + cls : ''), style: 'background:' + PAL[((i % PAL.length) + PAL.length) % PAL.length] }, ch.toUpperCase());
  }
  var PAIRS = /*__WORDS__*/[];
  if (!PAIRS.length) PAIRS = [['tea', 'coffee']];
  var S = null, session = null, offset = 0, ws = null, retry = 0, queue = [], open = false;
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  try { session = JSON.parse(load('uc.session') || 'null'); } catch (e) { session = null; }
  var savedName = load('uc.name') || '';

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'on';
    clearTimeout(toast.tm); toast.tm = setTimeout(function () { t.className = ''; }, 2600);
  }

  /* ---------- network ---------- */
  function send(m) {
    if (open && ws.readyState === 1) ws.send(JSON.stringify(m)); else queue.push(m);
  }
  function connect() {
    var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    ws = new WebSocket(url);
    ws.onopen = function () {
      open = true; retry = 0; document.getElementById('net').style.display = 'none';
      if (session) ws.send(JSON.stringify({ t: 'rejoin', code: session.code, token: session.token }));
      var q = queue; queue = []; q.forEach(function (m) { ws.send(JSON.stringify(m)); });
    };
    ws.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      onMsg(m);
    };
    ws.onclose = function () {
      open = false;
      if (S || session) document.getElementById('net').style.display = 'block';
      setTimeout(connect, Math.min(3000, 400 * Math.pow(2, retry++)));
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  setInterval(function () { if (open) send({ t: 'ping' }); }, 20000);

  var lastPhase = null;
  function onMsg(m) {
    if (m.t === 'joined') { session = { id: m.id, token: m.token, code: m.code }; store('uc.session', JSON.stringify(session)); }
    else if (m.t === 'state') {
      offset = m.now - Date.now();
      var phaseChanged = !S || S.phase !== m.phase;
      S = m;
      if (phaseChanged && lastPhase !== null && navigator.vibrate && (m.phase === 'describe' || m.phase === 'vote' || m.phase === 'over')) navigator.vibrate(120);
      lastPhase = m.phase;
      render();
    }
    else if (m.t === 'err') toast(m.msg);
    else if (m.t === 'norejoin') { session = null; store('uc.session', null); S = null; render(); }
    else if (m.t === 'kicked' || m.t === 'left') {
      if (m.t === 'kicked') toast('The host removed you from the lobby');
      session = null; store('uc.session', null); S = null; render();
    }
  }

  /* ---------- keep screen awake while playing ---------- */
  var wake = null;
  function wakeLock() {
    try { if (navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(function (l) { wake = l; l.addEventListener('release', function () { wake = null; }); }, function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S) wakeLock(); });

  /* ---------- shared components ---------- */
  function secsLeft() { return S && S.endsAt ? Math.max(0, Math.ceil((S.endsAt - (Date.now() + offset)) / 1000)) : 0; }
  function timerBox(total) {
    var num = h('b', null, '0'), fillBar = h('div'), root = h('div', { class: 'timer' }, num, h('div', { class: 'bar' }, fillBar));
    function tick() {
      if (!S) return;
      var s = secsLeft(), t = total();
      num.textContent = s; fillBar.style.width = Math.min(100, (s / t) * 100) + '%'; fillBar.className = s <= 5 ? 'low' : '';
    }
    return { root: root, tick: tick };
  }
  function wordCard() {
    var btn = h('button', { class: 'word', type: 'button' }), tm = null, shown = false;
    function paint() {
      var me = S && S.me;
      if (!me || !('word' in me)) { btn.style.display = 'none'; return; }
      btn.style.display = '';
      btn.className = 'word' + (shown ? ' show' : '');
      if (!shown) fill(btn, 'Tap to see your word');
      else if (me.white) fill(btn, 'You are Mr. White', h('span', { class: 'big' }, 'No word'), h('small', null, 'Blend in and work out the word'));
      else fill(btn, 'Your word', h('span', { class: 'big' }, me.word));
    }
    function hide() { shown = false; clearTimeout(tm); paint(); }
    btn.addEventListener('click', function () {
      if (shown) return hide();
      shown = true; paint(); clearTimeout(tm); tm = setTimeout(hide, 4000);
    });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    return { root: btn, update: paint };
  }
  function pidx(id) { for (var i = 0; i < S.players.length; i++) if (S.players[i].id === id) return i; return 0; }
  function nameOf(id) { var p = S.players.filter(function (x) { return x.id === id; })[0]; return p ? p.name : '?'; }
  function roleLabel(r) { return r === 'civilian' ? 'Civilian' : r === 'undercover' ? 'Undercover' : r === 'white' ? 'Mr. White' : ''; }
  function roleTag(r) { return r ? h('span', { class: 'tag ' + (r === 'civilian' ? 'civ' : r === 'undercover' ? 'und' : 'wht') }, roleLabel(r)) : null; }
  function playerRow(p, extra) {
    return h('li', null,
      avatar(p.name, pidx(p.id)),
      h('span', { class: 'dot' + (p.connected ? '' : ' off') }),
      h('span', { class: 'pname' + (p.alive === false && S.phase !== 'lobby' ? ' dead' : '') }, p.name, p.id === S.me.id ? ' (you)' : ''),
      p.host ? h('span', { class: 'tag' }, 'Host') : null,
      p.sup ? h('span', { class: 'tag' }, 'Supervisor') : null,
      extra);
  }
  function toggle(label, hint, onchange) {
    var inp = h('input', { type: 'checkbox', onchange: function () { onchange(inp.checked); } });
    return { inp: inp, root: h('div', { class: 'set' }, h('div', { class: 'lbl' }, label, hint ? h('small', null, hint) : null), h('label', { class: 'sw' }, inp, h('i'))) };
  }
  function stepper(min, max, stepBy, onchange) {
    var val = min, out = h('span', null, String(min));
    function set(v) { val = v; out.textContent = String(v); }
    function bump(d) { var n = Math.max(min, Math.min(max, val + d)); if (n !== val) { set(n); onchange(n); } }
    return { set: set, get: function () { return val; }, root: h('div', { class: 'step' }, h('button', { type: 'button', onclick: function () { bump(-stepBy); } }, '−'), out, h('button', { type: 'button', onclick: function () { bump(stepBy); } }, '+')) };
  }
  function hostBtn(label, msg, cls, confirmText) {
    return h('button', { class: 'btn ' + (cls || ''), type: 'button', onclick: function () { if (confirmText && !confirm(confirmText)) return; send(msg); } }, label);
  }

  /* ---------- header ---------- */
  var hdr = document.getElementById('hdr');
  function renderHeader() {
    if (!S) return fill(hdr, h('span', { class: 'logo' }, 'Undercover'), mode === 'menu' ? null : h('button', { class: 'link', type: 'button', onclick: goMenu }, '← Menu'));
    var parts = [];
    if (S.round > 0 && S.phase !== 'lobby') parts.push(h('span', { class: 'tag' }, 'Round ' + S.round));
    fill(hdr, h('span', { class: 'logo' }, 'Undercover'),
      h('div', { class: 'hdr-r' }, parts,
        h('button', { class: 'chip', type: 'button', onclick: shareLink }, S.code),
        h('button', { class: 'link', type: 'button', onclick: function () { if (confirm('Leave this lobby?')) send({ t: 'leave' }); } }, 'Leave')));
  }
  function shareLink() {
    var url = location.origin + '/?c=' + S.code;
    if (navigator.share) navigator.share({ title: 'Undercover', text: 'Join my Undercover lobby: ' + S.code, url: url }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, function () { toast(url); });

      if (w === 'impostors') return p.role === 'civilian' ? 0 : 4;
      return g[i] && g[i].ok ? 6 : 0;
    });
    L.gain.forEach(function (n, i) { if (L.roster[i]) L.roster[i].score += n; });
  }
  function wordCardFor(p) {
    return p.role === 'white'
      ? h('div', { class: 'word show' }, 'You are Mr. White', h('span', { class: 'big' }, 'No word'), h('small', null, 'Listen to the others and blend in'))
      : h('div', { class: 'word show' }, 'Your word', h('span', { class: 'big' }, p.word));
  }

  screens.solo = function () {
    var root = h('div'), pickT = null;
    function go(step) { L.step = step; saveSolo(); draw(); window.scrollTo(0, 0); }
    function draw() { clearInterval(pickT); clear(root); root.appendChild(views[L.step]()); if (L.step !== 'roster') wakeLock(); }

    // Private word view: the player taps THEIR OWN name, sees the word, then hides it.
    function openReveal(p) {
      var ov = h('div', { class: 'overlay' }, h('div', { class: 'ov-in' },
        h('div', { class: 'ov-hi' }, 'Hi ' + p.name + '! 👋'), h('div', { class: 'mute' }, 'Only you should look at the screen.'), wordCardFor(p),
        h('button', { class: 'btn primary', type: 'button', onclick: function () { p.seen = true; saveSolo(); draw(); } }, 'Hide it')));
      root.appendChild(ov);
    }
    function nameChips(onPick, filter) {
      return h('div', { class: 'chips' }, L.players.map(function (p, i) { return { p: p, i: i }; }).filter(function (x) { return !filter || filter(x.p); }).map(function (x) {
        return h('button', { class: 'chipbtn' + (x.p.seen ? ' done' : ''), type: 'button', onclick: function () { onPick(x.p); } },
          avatar(x.p.name, x.i), h('span', { class: 'nm' }, x.p.name), x.p.seen ? h('span', { class: 'ck' }, '✓') : null);
      }));
    }

    var views = {};

    /* ---- roster: add / rename / kick players, shuffle seats, role counts ---- */
    views.roster = function () {
      var R = L.roster, cfg = L.cfg, editing = -1;
      var list = h('div'), addIn = h('input', { type: 'text', maxlength: 14, autocomplete: 'off', enterkeyhint: 'done' });
      var info = h('p', { class: 'mute' }), err = h('p', { class: 'err center' }), autoRow = h('div', { class: 'center' });
      var uS = stepper(0, 10, 1, function (v) { cfg.u = v; cfg.manual = true; refresh(); });
      var wS = stepper(0, 5, 1, function (v) { cfg.w = v; cfg.manual = true; refresh(); });
      var start = h('button', { class: 'btn primary', type: 'button', onclick: function () { var e = checkSetup(); if (e) return toast(e); dealRoles(); saveSolo(); draw(); window.scrollTo(0, 0); } }, 'Start round');
      function taken(nm, except) { return R.some(function (r, i) { return i !== except && normW(r.name) === normW(nm); }); }
      function nextDefault() { var k = R.length + 1; while (taken('Player ' + k, -1)) k++; return 'Player ' + k; }
      function addP() {
        if (R.length >= 20) return toast('Maximum 20 players');
        var nm = (addIn.value.trim() || nextDefault()).slice(0, 14);
        if (taken(nm, -1)) return toast('That name is already used');
        R.push({ name: nm, score: 0 }); addIn.value = ''; saveSolo(); refresh(); addIn.focus();
      }
      addIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') addP(); });
      function paint() {
        var anyScore = R.some(function (r) { return r.score > 0; });
        addIn.placeholder = nextDefault();
        fill(list, R.length ? R.map(function (r, i) {
          var row = h('div', { class: 'rrow' }, h('span', { class: 'rno' }, String(i + 1)), avatar(r.name, i));
          if (editing === i) {
            var done = false, inp = h('input', { type: 'text', maxlength: 14, value: r.name, autocomplete: 'off', class: 'redit' });
            var commit = function () {
              if (done) return; done = true;
              var nm = inp.value.trim().slice(0, 14);
              if (nm && nm !== r.name) { if (taken(nm, i)) toast('That name is already used'); else { r.name = nm; saveSolo(); } }
              editing = -1; paint();
            };
            inp.addEventListener('blur', commit);
            inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') inp.blur(); });
            row.appendChild(inp);
            setTimeout(function () { try { inp.focus(); inp.select(); } catch (e) {} }, 30);
          } else {
            row.appendChild(h('button', { class: 'rname', type: 'button', onclick: function () { editing = i; paint(); } }, r.name));
          }
          if (anyScore) row.appendChild(h('span', { class: 'pts' }, r.score + ' pts'));
          row.appendChild(h('button', { class: 'rx', type: 'button', 'aria-label': 'Remove ' + r.name, onclick: function () { R.splice(i, 1); saveSolo(); refresh(); } }, '✕'));
          return row;
        }) : h('p', { class: 'mute center' }, 'No players yet. Add at least 3 below.'));
      }
      function refresh() {
        var e = checkSetup(), n = R.length;
        paint(); uS.set(cfg.u); wS.set(cfg.w);
        fill(info, n + ' players → ' + Math.max(0, n - cfg.u - cfg.w) + ' Civilian · ' + cfg.u + ' Undercover · ' + cfg.w + ' Mr. White');
        fill(autoRow, cfg.manual ? h('button', { class: 'link', type: 'button', onclick: function () { cfg.manual = false; refresh(); } }, 'Set roles automatically') : null);
        fill(err, e || ''); start.disabled = !!e; saveSolo();
      }
      var node = h('div', null,
        h('h1', null, 'Players'),
        h('p', { class: 'sub' }, 'Add everyone who is playing. Tap a name to edit it. Players and points are remembered for the next rounds.'),
        h('div', { class: 'card' }, list, h('div', { class: 'addrow' }, addIn, h('button', { class: 'btn primary', type: 'button', onclick: addP }, 'Add'))),
        h('div', { class: 'card' }, h('h2', null, 'Roles'),
          h('div', { class: 'set' }, h('div', { class: 'lbl' }, 'Undercover'), uS.root),
          h('div', { class: 'set' }, h('div', { class: 'lbl' }, 'Mr. White'), wS.root), info, autoRow),
        err, start, h('div', { class: 'gap' }),
        h('div', { class: 'row wrap' },
          h('button', { class: 'btn small', type: 'button', onclick: function () { if (R.length < 2) return; L.roster = R = shuf(R); saveSolo(); refresh(); toast('Seats shuffled'); } }, '🔀 Shuffle seats'),
          h('button', { class: 'btn small', type: 'button', onclick: function () { if (R.some(function (r) { return r.score; }) && confirm('Reset everyone\'s points to 0?')) { R.forEach(function (r) { r.score = 0; }); refresh(); } } }, 'Reset points'),
          h('button', { class: 'btn small danger', type: 'button', onclick: function () { if (R.length && confirm('Remove all players?')) { R.length = 0; cfg.manual = false; refresh(); } } }, 'Clear all')));
      refresh(); return node;
    };

    /* ---- reveal: everyone taps their own name to see their word; pick who starts ---- */
    views.reveal = function () {
      var P = L.players, n = P.length;
      var chipsBox = h('div'), cnt = h('p', { class: 'mute center' }), orderBox = h('div', { class: 'card' });
      var pickBtn = h('button', { class: 'btn violet', type: 'button', onclick: pick }, '🎲 Pick who starts');
      function seen() { return P.filter(function (p) { return p.seen; }).length; }
      function paintChips() { fill(chipsBox, nameChips(openReveal)); fill(cnt, seen() + ' of ' + n + ' have seen their word'); }
      function paintOrder(hl) {
        var s = L.starter == null ? 0 : L.starter;
        fill(orderBox, h('h2', null, L.starter == null ? 'Clue order' : 'Clue order · ' + P[s].name + ' starts'),
          h('ul', { class: 'plist' }, P.map(function (_, j) {
            var idx = (s + j) % n, p = P[idx];
            return h('li', { class: hl === idx ? 'hl' : '' }, h('span', { class: 'rno' }, String(j + 1)), avatar(p.name, idx), h('span', { class: 'pname' }, p.name), j === 0 && L.starter != null ? h('span', { class: 'tag ok' }, 'Starts') : null);
          })), h('div', { class: 'gap' }), pickBtn);
      }
      function pick() {
        pickBtn.disabled = true;
        var fin = rnd(n), k = 0, total = 12, from = ((fin - total) % n + n) % n;
        pickT = setInterval(function () {
          paintOrder((from + k) % n); k++;
          if (k > total) { clearInterval(pickT); L.starter = fin; saveSolo(); paintOrder(-1); pickBtn.disabled = false; if (navigator.vibrate) navigator.vibrate(150); }
        }, 90);
      }
      paintChips(); paintOrder(-1);
      return h('div', null,
        h('h1', null, 'See your word'),
        h('p', { class: 'sub' }, 'Tap your own name to see your word in private, then hide it. Then say your clues out loud, in order.'),
        h('div', { class: 'card' }, chipsBox, cnt), orderBox,
        h('button', { class: 'btn primary', type: 'button', onclick: function () { if (seen() < n && !confirm('Not everyone has seen their word yet. Start the discussion anyway?')) return; go('play'); } }, 'Start discussion & voting'));
    };

    /* ---- play: discuss offline, then kick any number of players ---- */
    views.play = function () {
      var sel = {}, alive = [], out = [];
      L.players.forEach(function (p, i) { (p.alive ? alive : out).push({ p: p, i: i }); });
      var list = h('div'), btn = h('button', { class: 'btn primary', type: 'button', disabled: true, onclick: kick }), peekBox = h('div');
      function count() { return Object.keys(sel).filter(function (k) { return sel[k]; }).length; }
      function paint() {
        fill(list, alive.map(function (x) {
          var on = !!sel[x.i];
          return h('button', { class: 'vbtn' + (on ? ' sel' : ''), type: 'button', onclick: function () { sel[x.i] = !on; paint(); } }, h('span', { class: 'vl' }, avatar(x.p.name, x.i), h('span', null, x.p.name)), on ? h('span', null, '✓') : null);
        }));
        var k = count(); btn.disabled = k === 0; fill(btn, k ? 'Kick out selected (' + k + ')' : 'Select who to kick out');
      }
      function kick() {
        var ids = alive.filter(function (x) { return sel[x.i]; }).map(function (x) { return x.i; });
        if (!ids.length) return;
        if (ids.length >= alive.length) return toast('At least one player has to stay');
        if (!confirm('Kick out ' + ids.map(function (i) { return L.players[i].name; }).join(', ') + '?')) return;
        ids.forEach(function (i) { L.players[i].alive = false; });
        L.last = { ids: ids, guess: {} }; go('result');
      }
      function peekClosed() { fill(peekBox, h('button', { class: 'link', type: 'button', onclick: peekOpen }, 'Forgot your word? Check it')); }
      function peekOpen() { fill(peekBox, h('div', { class: 'card' }, h('h2', null, 'Tap your name'), nameChips(openReveal, function (p) { return p.alive; }), h('button', { class: 'btn small', type: 'button', onclick: peekClosed }, 'Cancel'))); }
      paint(); peekClosed();
      return h('div', null,
        h('h1', null, 'Discussion'),
        h('p', { class: 'sub' }, 'Talk it out and vote however you like. Then tap everyone who is being kicked out. Pick any number of players.'),
        h('div', { class: 'card' }, h('h2', null, alive.length + ' players left'), list), btn,
        out.length ? h('div', { class: 'card' }, h('h2', null, 'Out'), h('ul', { class: 'plist' }, out.map(function (x) { return h('li', null, avatar(x.p.name, x.i), h('span', { class: 'pname dead' }, x.p.name), roleTag(x.p.role)); }))) : null,
        h('div', { class: 'gap' }), peekBox);
    };

    views.result = function () {
      var ids = L.last.ids, g = L.last.guess;
      var whites = ids.filter(function (i) { return L.players[i].role === 'white'; });
      var cont = h('button', { class: 'btn primary', type: 'button', onclick: function () {
        if (whites.some(function (i) { return g[i].ok; })) { L.winner = 'white'; scoreGame(); return go('over'); }
        var w = soloWin(); if (w) { L.winner = w; scoreGame(); return go('over'); }
        go('play');
      } }, 'Continue');
      cont.disabled = whites.some(function (i) { return !g[i]; });
      var cards = whites.map(function (i) {
        var p = L.players[i];
        if (g[i]) return h('div', { class: 'card' }, h('h2', null, p.name + ' (Mr. White): final guess'), h('p', null, '“' + (g[i].text || '—') + '” → ', g[i].ok ? '✓ Correct! Mr. White wins.' : '✗ Wrong.'));
        var inp = h('input', { type: 'text', maxlength: 40, placeholder: 'The civilians\' word…', autocomplete: 'off' });
        var submit = function () { g[i] = { text: inp.value.trim(), ok: !!inp.value.trim() && normW(inp.value) === normW(L.pair.civilian) }; saveSolo(); draw(); };
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
        return h('div', { class: 'card' }, h('h2', null, p.name + ' is Mr. White'), h('p', null, 'One last chance: ' + p.name + ', type the civilians\' word. Nobody else should see it yet.'), inp, h('div', { class: 'gap' }), h('button', { class: 'btn', type: 'button', onclick: submit }, 'Submit guess'));
      });
      return h('div', null,
        h('div', { class: 'card result' }, h('div', { class: 'mute' }, 'Kicked out'),
          ids.map(function (i) { var p = L.players[i]; return h('div', null, h('div', { class: 'who' }, p.name), h('div', { class: 'what' }, 'was ' + roleLabel(p.role))); })),
        cards, cont);
    };

    views.over = function () {
      var w = L.winner;
      var ban = h('div', { class: 'banner center ' + (w === 'civilians' ? 'ok' : 'bad') }, w === 'civilians' ? '🎉 Civilians win!' : w === 'impostors' ? '🕵️ Undercover team wins!' : '⬜ Mr. White wins. They guessed the word!');
      var order = L.roster.map(function (r, i) { return { r: r, i: i }; }).sort(function (a, b) { return b.r.score - a.r.score || a.i - b.i; });
      return h('div', null, ban,
        h('div', { class: 'card' }, h('div', { class: 'set' }, h('div', { class: 'lbl' }, 'Civilian word'), h('b', null, L.pair.civilian)), h('div', { class: 'set' }, h('div', { class: 'lbl' }, 'Undercover word'), h('b', null, L.pair.undercover))),
        h('div', { class: 'card' }, h('h2', null, 'Everyone\'s role'), L.players.map(function (p, i) {
          return h('div', { class: 'sup-row' }, h('div', { class: 'vl', style: 'display:flex;align-items:center;gap:10px' }, avatar(p.name, i, 'sm'), h('b', null, p.name), p.alive ? '' : h('span', { class: 'tag' }, 'out')), h('div', null, roleTag(p.role), ' ', h('span', { class: 'w' }, p.role === 'white' ? '—' : p.word)));
        })),
        h('div', { class: 'card' }, h('h2', null, 'Scoreboard'), h('ul', { class: 'plist' }, order.map(function (x) {
          var g = L.gain && L.gain[x.i];
          return h('li', null, avatar(x.r.name, x.i, 'sm'), h('span', { class: 'pname' }, x.r.name), g ? h('span', { class: 'tag ok' }, '+' + g) : null, h('span', { class: 'pts' }, x.r.score + ' pts'));
        }))),
        h('button', { class: 'btn primary', type: 'button', onclick: function () { go('roster'); } }, 'Next round'),
        h('p', { class: 'mute center' }, 'Next round: add, rename or remove players, shuffle seats, then start.'));
    };

    draw();
    return { root: root, update: function () {} };
  };

  /* ---------- render loop ---------- */
  var app = document.getElementById('app'), cur = null, curKey = null;
  function keyFor() {
    if (!S) return mode === 'menu' ? 'menu' : mode === 'solo' ? 'solo' : 'home';
    if (S.phase === 'lobby') return S.me.host ? 'lobby-host' : 'lobby';
    return S.phase;
  }
  function render() {
    renderHeader();
    var key = keyFor();
    if (key !== curKey) {
      curKey = key; clear(app);
      cur = (key === 'home' ? screens.home : key.indexOf('lobby') === 0 ? screens.lobby : screens[key])();
      app.appendChild(cur.root);
      window.scrollTo(0, 0);
    }
    if (S && S.phase !== 'lobby' && S.phase !== 'over') wakeLock();
    cur.update();
  }
  setInterval(function () { if (cur && cur.tick) cur.tick(); }, 250);

  render();
  connect();
})();
</script>
</body>
</html>
