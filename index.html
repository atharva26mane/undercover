<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8E7">
<title>Undercover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3cf;--ink:#1d1147;--mute:#6b6394;--card:#fff;--violet:#7c4dff;--pink:#ff4f9a;--yellow:#ffd23f;--teal:#12b5a0;--orange:#ff7a2f;--blue:#3d8bff;--green:#27b866;--red:#e8384f;--lav:#efe9ff;--line:#e4dcff;--sh:0 4px 0 var(--ink);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:600 16px/1.4 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 8% 0,#ffe08a 0,transparent 42%),radial-gradient(circle at 100% 18%,#ffc2dd 0,transparent 38%),var(--bg);background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#wrap{max-width:520px;margin:0 auto;padding:12px 14px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;min-height:40px}
.logo{background:var(--violet);color:#fff;border:3px solid var(--ink);padding:4px 13px;border-radius:999px;font-weight:900;letter-spacing:.1em;font-size:13px;text-transform:uppercase;box-shadow:0 3px 0 var(--ink)}
.hdr-r{display:flex;gap:8px;align-items:center}
.chip{background:var(--yellow);border:3px solid var(--ink);color:var(--ink);border-radius:999px;padding:4px 13px;font:inherit;font-weight:900;letter-spacing:.14em;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.link{background:none;border:0;color:var(--ink);font:inherit;font-size:14px;font-weight:800;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
h1{font-size:36px;line-height:1.05;margin:14px 0 6px;letter-spacing:-.02em;font-weight:900}
h2{font-size:13px;margin:0 0 10px;color:var(--violet);font-weight:900;text-transform:uppercase;letter-spacing:.1em}
p{margin:6px 0}
.sub{color:var(--mute);margin:0 0 16px;font-size:16px}
.hero{text-align:center;padding:6px 0 4px}.hero-emoji{font-size:58px;line-height:1;filter:drop-shadow(0 4px 0 rgba(29,17,71,.2))}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:15px;margin-bottom:16px;box-shadow:var(--sh)}
input[type=text],input[type=number]{width:100%;background:#fff;border:3px solid var(--ink);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:18px;font-weight:700;outline:none}
input:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(124,77,255,.25)}
input::placeholder{color:#a79fc9}
input.code{text-transform:uppercase;letter-spacing:.35em;text-align:center;font-weight:900;font-size:26px}
.btn{display:block;width:100%;min-height:54px;border:3px solid var(--ink);border-radius:16px;font:inherit;font-size:17px;font-weight:900;padding:11px 16px;background:#fff;color:var(--ink);box-shadow:var(--sh);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--yellow)}
.btn.violet{background:var(--violet);color:#fff}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red);box-shadow:0 4px 0 var(--red)}
.btn.small{min-height:40px;font-size:14px;padding:6px 12px;width:auto;display:inline-block;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.small.danger{box-shadow:0 3px 0 var(--red)}
.btn[disabled]{opacity:.4;box-shadow:none;transform:none}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row.wrap{flex-wrap:wrap}
.gap{height:12px}
.mute{color:var(--mute)}
.err{color:var(--red);font-weight:800}
.center{text-align:center}
.bigcode{font-size:60px;font-weight:900;letter-spacing:.2em;text-align:center;padding-left:.2em;color:var(--violet);text-shadow:3px 3px 0 var(--yellow)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:2px dashed var(--line)}
.plist li:first-child{border-top:0}
.plist li.hl{background:#ffe9a8;border-radius:12px;padding-left:6px;padding-right:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.dot.off{background:#c3bcd9}
.av{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff;font-weight:900;font-size:18px;text-shadow:0 2px 0 rgba(29,17,71,.45)}
.av.sm{width:30px;height:30px;font-size:14px;border-width:2px}
.pname{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname.dead{text-decoration:line-through;color:var(--mute)}
.tag{font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px;background:#fff;border:2px solid var(--ink);color:var(--ink);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tag.civ,.tag.ok{background:#c8f6dc}.tag.und{background:#ffd0d6}.tag.wht{background:#fff;border-style:dashed}
.pts{font-size:12px;font-weight:900;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:2px 9px;white-space:nowrap}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:2px dashed var(--line)}
.set:first-of-type{border-top:0}
.set .lbl{flex:1;font-weight:800}.set .lbl small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.step{display:flex;align-items:center;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.step button{width:44px;height:42px;background:var(--lav);border:0;color:var(--ink);font:inherit;font-size:24px;font-weight:900}
.step button:active{background:var(--yellow)}
.step span{min-width:46px;text-align:center;font-weight:900;font-size:19px}
.sw{position:relative;width:56px;height:32px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2}
.sw i{position:absolute;inset:0;background:#fff;border:3px solid var(--ink);border-radius:999px;transition:.15s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:.15s}
.sw input:checked+i{background:var(--teal)}
.sw input:checked+i:after{left:27px;background:#fff;border:2px solid var(--ink)}
.timer{text-align:center;margin-bottom:14px}
.timer b{font-size:60px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:16px;background:#fff;border:3px solid var(--ink);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--teal);width:100%;transition:width .25s linear}
.bar>div.low{background:var(--red)}
.word{display:block;width:100%;text-align:center;border:3px dashed var(--ink);background:#fff;color:var(--mute);border-radius:22px;padding:18px;font:inherit;font-size:16px;font-weight:800;margin-bottom:16px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.word.show{border-style:solid;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;box-shadow:var(--sh)}
.word .big{display:block;font-size:40px;font-weight:900;color:var(--yellow);margin-top:4px;word-break:break-word;text-shadow:0 3px 0 rgba(29,17,71,.35)}
.word small{display:block;opacity:.9;font-weight:700;margin-top:4px}
.banner{border-radius:18px;padding:13px 15px;margin-bottom:14px;font-weight:800;background:var(--yellow);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.banner.bad{background:#ffd0d6}.banner.ok{background:#c8f6dc}
.desc{display:flex;gap:8px;padding:8px 0;border-top:2px dashed var(--line)}
.desc:first-child{border-top:0}.desc b{min-width:86px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.desc span{flex:1;word-break:break-word}
.vbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;min-height:58px;padding:9px 14px;margin-bottom:10px;border-radius:18px;border:3px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-size:17px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.vbtn:active{transform:translateY(3px);box-shadow:none}
.vbtn.sel{background:#ffe9a8;transform:translateY(3px);box-shadow:none}
.vbtn .vl{display:flex;align-items:center;gap:10px;min-width:0}
.vbtn small{color:var(--mute);font-weight:700;font-size:12px;text-align:right}
.result{text-align:center;padding:22px 14px}
.result .who{font-size:34px;font-weight:900;margin:4px 0}
.result .what{font-size:22px;font-weight:900;color:var(--violet)}
.result .w{font-size:18px;color:var(--mute);margin-top:6px}
.sup-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:2px dashed var(--line);align-items:center}
.sup-row:first-child{border-top:0}.sup-row .w{color:var(--violet);font-weight:900}.sup-row .d{grid-column:1/3;color:var(--mute);font-size:14px}
details{margin-top:8px}summary{color:var(--ink);cursor:pointer;padding:6px 0;font-weight:800}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.chipbtn{display:flex;align-items:center;gap:9px;min-height:62px;border:3px solid var(--ink);border-radius:18px;background:#fff;padding:8px 10px;font:inherit;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--ink);text-align:left;color:var(--ink)}
.chipbtn:active{transform:translateY(3px);box-shadow:none}
.chipbtn.done{background:#d3f8e3}
.chipbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipbtn .ck{font-size:19px;color:var(--green)}
.rrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:2px dashed var(--line)}
.rrow:first-child{border-top:0}
.rno{width:20px;text-align:center;color:var(--mute);font-weight:900;font-size:14px;flex:none}
.rname{flex:1;min-width:0;background:none;border:0;font:inherit;font-weight:800;font-size:17px;text-align:left;color:var(--ink);padding:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.redit{padding:7px 10px!important;font-size:17px!important;border-radius:12px!important;flex:1;min-width:0}
.rx{border:3px solid var(--ink);background:#ffd0d6;border-radius:12px;width:40px;height:40px;font:inherit;font-weight:900;font-size:16px;color:var(--ink);flex:none}
.rx:active{background:var(--red);color:#fff}
.addrow{display:flex;gap:10px;margin-top:12px}.addrow input{flex:1}.addrow .btn{width:auto;min-height:50px;padding:8px 18px}
.mode h2{display:flex;align-items:center;gap:8px}
.mode-ic{display:inline-flex;width:34px;height:34px;border-radius:12px;border:3px solid var(--ink);align-items:center;justify-content:center;font-size:18px}
.overlay{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,var(--violet),var(--pink));display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease-out}
.ov-in{width:100%;max-width:440px;text-align:center;color:#fff}
.ov-hi{font-size:36px;font-weight:900;margin-bottom:2px;text-shadow:0 3px 0 rgba(29,17,71,.35)}
.ov-in .mute{color:rgba(255,255,255,.9);margin-bottom:16px}
.overlay .word.show{background:#fff;color:var(--ink);border-width:3px}
.overlay .word .big{color:var(--violet);text-shadow:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;text-align:center}
#toast.on{opacity:1}
#net{position:fixed;top:0;left:0;right:0;background:var(--red);color:#fff;text-align:center;font-weight:900;padding:7px;font-size:14px;z-index:60;display:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#app>*{animation:rise .24s ease-out}
@media (prefers-reduced-motion:reduce){#app>*,.overlay{animation:none}.btn,.vbtn,.chipbtn{transition:none}}

/* ===== v4: compact layout, seating, animations ===== */
h1{font-size:30px;margin:6px 0 4px}
.sub{font-size:14.5px;margin:0 0 12px}
.card{padding:13px;margin-bottom:12px}
.card.tight{padding:8px 12px}
.small{font-size:13px}
.dock{position:sticky;bottom:0;z-index:6;margin:6px -14px 0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 62%,rgba(255,243,207,0))}
.rrow{padding:3px 0;gap:8px;background:#fff;position:relative}
.rrow:not(.dragging){transition:transform .16s ease}
.rrow.dragging{z-index:5;box-shadow:0 8px 18px rgba(29,17,71,.25);border-radius:14px;transition:none}
.handle{width:30px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--mute);touch-action:none;cursor:grab;flex:none;user-select:none;-webkit-user-select:none;background:none;border:0;padding:0}
.rname{padding:6px 0;font-size:16px}
.rx{width:34px;height:34px;font-size:14px;border-width:2px;border-radius:10px}
.addrow{margin-top:8px}.addrow .btn{min-height:46px}.addrow input{padding:10px 12px;font-size:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tools .btn.small{min-height:34px;font-size:13px;padding:4px 10px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role-box .lbl{font-size:13px;font-weight:900;margin-bottom:6px}
.roles .step{display:inline-flex}.roles .step button{width:38px;height:38px}.roles .step span{min-width:34px}
.enter{animation:slidein .28s ease-out}
.leave{animation:shrinkout .22s ease-in forwards}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes shrinkout{to{opacity:0;transform:scale(.85)}}
.seats{display:flex;flex-direction:column;gap:7px}
.seat{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:6px 12px;border:3px solid var(--ink);border-radius:16px;background:#fff;font:inherit;font-weight:800;font-size:16px;color:var(--ink);box-shadow:0 3px 0 var(--ink);text-align:left}
.seat .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .ck{color:var(--green);font-size:19px}
.seat.done{background:#d3f8e3}
.seat.next{background:var(--yellow);animation:nudge 1.4s ease-in-out infinite}
.seat[disabled]{opacity:.5;box-shadow:none}
.seat:active:not([disabled]){transform:translateY(3px);box-shadow:none}
.lock{font-size:14px;opacity:.7}
@keyframes nudge{0%,100%{box-shadow:0 3px 0 var(--ink),0 0 0 0 rgba(255,210,63,.9)}50%{box-shadow:0 3px 0 var(--ink),0 0 0 7px rgba(255,210,63,.35)}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.ring{position:relative;margin:8px auto 14px}
.ring::before{content:"";position:absolute;inset:26px;border:3px dashed rgba(29,17,71,.22);border-radius:50%}
.ring-p{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.ring-n{font-size:11px;font-weight:900;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 5px}
.ring-p.lit{transform:translate(-50%,-50%) scale(1.25)}
.ring-p.lit .av{box-shadow:0 0 0 5px var(--yellow)}
.ring-p.win{transform:translate(-50%,-50%) scale(1.4);animation:winpop .5s ease-out;z-index:2}
.ring-p.win .av{box-shadow:0 0 0 6px var(--yellow),0 0 22px 8px rgba(255,210,63,.85)}
@keyframes winpop{0%{transform:translate(-50%,-50%) scale(1)}60%{transform:translate(-50%,-50%) scale(1.65)}100%{transform:translate(-50%,-50%) scale(1.4)}}
.ring-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:900;width:52%;font-size:15px}
.ring-q{font-size:34px;line-height:1.1}
.ring-q.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.flip{perspective:1000px;height:210px;margin:6px 0 18px;cursor:pointer}
.flip-in{position:relative;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.35,.5,1)}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border:3px solid var(--ink);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;box-shadow:var(--sh);font-weight:800}
.face.back{background:repeating-linear-gradient(45deg,var(--yellow) 0 16px,#ffe17a 16px 32px);color:var(--ink);font-size:18px}
.back-ic{font-size:60px;line-height:1;margin-bottom:6px}
.face.front{background:#fff;color:var(--ink);transform:rotateY(180deg)}
.face.front .big{display:block;font-size:42px;font-weight:900;color:var(--violet);word-break:break-word;line-height:1.1;margin-top:4px}
.face.front small{display:block;color:var(--mute);margin-top:6px}
.overlay.out{animation:fadeout .16s forwards}@keyframes fadeout{to{opacity:0}}
.link.light{color:#fff}
.kick{animation:zoomin .45s cubic-bezier(.3,1.5,.5,1) both;margin-bottom:10px}
.av.xl{width:84px;height:84px;font-size:38px;border-width:4px}
.stamp{display:inline-block;margin-top:8px;border:4px solid var(--ink);padding:4px 14px;border-radius:12px;font-size:24px;font-weight:900;letter-spacing:.06em;transform:rotate(-7deg);animation:stamp .42s cubic-bezier(.2,1.4,.4,1) both;background:#fff}
.stamp.civ{color:var(--green);border-color:var(--green)}.stamp.und{color:var(--red);border-color:var(--red)}.stamp.wht{color:var(--ink);border-style:dashed}
@keyframes zoomin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-7deg)}70%{opacity:1;transform:scale(.92) rotate(-7deg)}100%{opacity:1;transform:scale(1) rotate(-7deg)}}
.thud{animation:shake .35s ease-in-out both}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.still,.still *{animation:none!important}
.flash-ok{animation:flashok .8s ease-out}@keyframes flashok{0%{background:#7ef0b0}100%{background:#fff}}
.shake-no{animation:shake .4s ease-in-out;border-color:var(--red)!important}
.dots{padding:10px 0;text-align:center}
.dots span{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--violet);margin:0 3px;animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-8px);opacity:1}}
.chipbtn.sel{background:#ffd0d6;animation:wiggle .3s}
.chipbtn.leave{animation:shrinkout .25s ease-in forwards}
@keyframes wiggle{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.pop{animation:popin .25s cubic-bezier(.3,1.8,.5,1)}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
.bounce{animation:bouncein .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bouncein{0%{opacity:0;transform:scale(.4) translateY(-30px)}100%{opacity:1;transform:none}}
.gain{animation:popin .35s .9s cubic-bezier(.3,1.8,.5,1) both}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
#app .word.show{animation:flipin .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes flipin{from{transform:perspective(700px) rotateY(90deg)}to{transform:perspective(700px) rotateY(0)}}
.wake{display:flex;align-items:center;gap:12px}
.wake>div:not(.shim){flex:1}
.shim,.shim-line{background:linear-gradient(90deg,#efe9ff 25%,#fff 50%,#efe9ff 75%);background-size:200% 100%;animation:shim 1.1s linear infinite}
.shim{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink)}
.shim-line{height:12px;border-radius:6px;margin:6px 0}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;padding:10px 12px 10px 16px;border-radius:16px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap}
.update .btn{min-height:36px;padding:4px 12px;width:auto;box-shadow:none;font-size:14px}

/* ===== Chai Tapri theme (design direction by Gemini, built on the working app) ===== */
:root{--bg:#FFF8E7;--bg2:#F2E8CF;--ink:#121212;--mute:#5A554C;--card:#fff;
--orange:#FF4D00;--orange-l:#FFE4D6;--yellow:#FFD600;--yellow-l:#FFF5B8;--violet:#7B2CBF;--violet-l:#F3E5FF;
--pink:#E6003D;--red:#E6003D;--red-l:#FFD6E0;--green:#00A859;--green-l:#D4F7E6;--teal:#00A859;--blue:#2F6BFF;--lav:#F3E5FF;--line:#e3d8bd;
--sh:4px 4px 0 var(--ink);--sh-s:2px 2px 0 var(--ink);--sh-l:6px 6px 0 var(--ink);
--f-disp:'Syne','Arial Black',Impact,system-ui,sans-serif;--f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
--spring:cubic-bezier(.34,1.56,.64,1);--snap:cubic-bezier(.22,1,.36,1)}
html,body{font-family:var(--f-body);font-weight:600}
body{background-color:var(--bg);background-image:radial-gradient(rgba(18,18,18,.08) 1.25px,transparent 1.25px);background-size:16px 16px;background-attachment:fixed}
h1{font-family:var(--f-disp);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;font-size:28px;line-height:1}
h2,.lbl-mono{font-family:var(--f-mono);font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.sub{color:var(--mute);font-weight:700}
.logo{background:var(--ink);color:var(--yellow);border:3px solid var(--ink);box-shadow:none;font-family:var(--f-disp);letter-spacing:.04em;border-radius:8px}
.chip{background:var(--yellow);box-shadow:var(--sh-s);font-family:var(--f-mono)}
.card{border-radius:14px;box-shadow:var(--sh)}
.btn{font-family:var(--f-disp);font-weight:800;text-transform:uppercase;letter-spacing:.02em;border-radius:14px;box-shadow:var(--sh);min-height:56px}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--orange);color:#fff;text-shadow:1.5px 1.5px 0 var(--ink)}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.violet{background:var(--violet);color:#fff;text-shadow:1.5px 1.5px 0 var(--ink)}
.btn.green{background:var(--green);color:#fff;text-shadow:1.5px 1.5px 0 var(--ink)}
.btn.danger{background:var(--red);color:#fff;border-color:var(--ink);box-shadow:var(--sh);text-shadow:1.5px 1.5px 0 var(--ink)}
.btn.small{font-family:var(--f-body);text-transform:none;letter-spacing:0;min-height:38px;box-shadow:var(--sh-s);border-width:2px}
.btn.small.danger{background:#fff;color:var(--red);text-shadow:none;box-shadow:var(--sh-s)}
.btn[disabled]{opacity:.45}
input[type=text],input[type=number]{border-radius:10px;font-family:var(--f-body)}
input:focus{border-color:var(--ink);background:var(--yellow-l);box-shadow:none}
input.code{font-family:var(--f-mono)}
.bigcode{font-family:var(--f-mono);color:var(--yellow);background:var(--ink);border-radius:14px;text-shadow:none;padding:8px 0 8px .2em;font-size:52px}
.tag{font-family:var(--f-mono)}
.tag.civ{background:var(--green-l)}.tag.und{background:var(--orange-l)}.tag.wht{background:var(--violet-l);border-style:solid}
.pts{font-family:var(--f-mono);background:var(--yellow)}
.banner{background:var(--yellow);box-shadow:var(--sh)}
.banner.ok{background:var(--green-l)}.banner.bad{background:var(--red-l)}
.vbtn{box-shadow:var(--sh-s);border-radius:12px}
.vbtn.sel{background:var(--red-l)}
.timer b{font-family:var(--f-mono)}
.bar>div{background:var(--orange)}
.word{border-radius:18px}
.word.show{background:var(--ink);color:#bdb6a8;border:3px solid var(--ink);box-shadow:var(--sh-l)}
.word .big{color:var(--yellow);font-family:var(--f-disp);text-transform:uppercase;text-shadow:none}
.step{border-radius:10px;border-width:2px}
.step button{background:var(--yellow);font-family:var(--f-mono)}
.sw input:checked+i{background:var(--green)}
.av{text-shadow:none}
.dock{background:linear-gradient(to top,var(--bg) 70%,rgba(255,248,231,0))}
.update{background:var(--ink)}
.dot{background:var(--green)}

/* home poster */
.poster{background:var(--yellow);border:3px solid var(--ink);border-radius:20px;box-shadow:var(--sh-l);padding:18px 16px;text-align:center;margin:4px 0 14px}
.poster-tag{display:inline-block;background:var(--ink);color:var(--yellow);font-family:var(--f-mono);font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;margin-bottom:8px}
.poster h1{font-size:44px;line-height:.92;margin:4px 0 8px}
.poster p{font-weight:800;font-size:14px;margin:0}
.mode-card{background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.mode-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.mode-title{font-family:var(--f-disp);font-weight:800;text-transform:uppercase;font-size:17px}
.pill{font-family:var(--f-mono);font-size:10.5px;font-weight:800;padding:3px 9px;border:2px solid var(--ink);border-radius:999px;background:var(--yellow);box-shadow:var(--sh-s);white-space:nowrap;text-transform:uppercase}
.pill.green{background:var(--green);color:#fff}.pill.violet{background:var(--violet-l)}.pill.ink{background:var(--ink);color:var(--yellow)}

/* roster */
.seatno{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--yellow);font-family:var(--f-mono);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.rrow{background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:var(--sh-s);padding:4px 8px;margin-bottom:8px}
.rrow:first-child{border-top:2px solid var(--ink)}
.rrow.dragging{background:var(--yellow-l);box-shadow:var(--sh)}
.rname{font-weight:800}
.rx{background:var(--bg);border-width:2px;color:var(--red)}
.role-box{background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:var(--sh-s);padding:8px 10px}
.role-box .lbl{font-family:var(--f-body);font-size:12.5px}

/* roulette */
.roulette{background:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:var(--sh-l);padding:22px 14px;text-align:center;margin-bottom:14px;overflow:hidden}
.roulette .cap{font-family:var(--f-mono);font-size:11px;color:#aaa;margin-bottom:6px}
.slot{font-family:var(--f-disp);font-weight:800;font-size:34px;color:var(--yellow);text-transform:uppercase;min-height:46px;display:flex;align-items:center;justify-content:center;word-break:break-word;line-height:1.05}
.slot.tick{animation:tick .09s ease-out}
@keyframes tick{from{transform:translateY(-35%);opacity:.3}to{transform:none;opacity:1}}
.bol{display:inline-block;margin-top:12px;padding:6px 16px;background:var(--orange);color:#fff;font-family:var(--f-disp);font-weight:800;font-size:20px;text-transform:uppercase;border:3px solid #fff;border-radius:8px;transform:rotate(-4deg) scale(0);opacity:0}
.bol.on{animation:bol .45s var(--spring) forwards}
@keyframes bol{0%{transform:rotate(-4deg) scale(2.6);opacity:0}70%{opacity:1;transform:rotate(-4deg) scale(.9)}100%{opacity:1;transform:rotate(-4deg) scale(1)}}
.order{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px;background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:var(--sh-s)}
.order.flat{background:transparent;border:0;box-shadow:none;padding:4px 0 0;justify-content:flex-start}
.onode{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border:2px solid var(--ink);border-radius:999px;font-size:12.5px;font-weight:800;background:var(--bg)}
.onode.done{background:var(--green-l);opacity:.8}
.onode.cur{background:var(--yellow);box-shadow:var(--sh-s);transform:scale(1.06)}
.onode.out{text-decoration:line-through;opacity:.5}

/* pass the phone + hold-to-peek shutter */
.pass{background:var(--yellow);border:3px solid var(--ink);border-radius:20px;box-shadow:var(--sh-l);padding:20px 16px;text-align:center;margin:14px 0}
.pass .to{font-family:var(--f-mono);font-size:12px;font-weight:800;margin-top:10px}
.pass .who{font-family:var(--f-disp);font-weight:800;font-size:38px;line-height:1.05;text-transform:uppercase;margin:6px 0 8px;word-break:break-word}
.pass p{font-size:13px;font-weight:700;margin:0}
.peek-head{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
.stage{position:relative;height:230px;background:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:var(--sh-l);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;user-select:none;-webkit-user-select:none}
.stage .s-lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:#a09a90}
.stage .s-word{font-family:var(--f-disp);font-weight:800;color:var(--yellow);text-transform:uppercase;line-height:1.05;margin:8px 0;word-break:break-word}
.stage .s-note{font-family:var(--f-mono);font-size:12px;color:var(--bg);opacity:.85}
.shutter{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(-45deg,var(--yellow) 0 18px,var(--ink) 18px 36px);transition:transform .2s var(--snap)}
.stage.peeking .shutter{transform:translateY(-102%)}
.plaque{background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:var(--sh);padding:12px 18px}
.plaque b{display:block;font-family:var(--f-disp);font-weight:800;text-transform:uppercase;font-size:18px}
.plaque span{font-size:12px;font-weight:700;color:var(--mute)}
.hold{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hold.down{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.sheet{position:fixed;inset:0;z-index:30;overflow:auto;background-color:var(--bg);background-image:radial-gradient(rgba(18,18,18,.08) 1.25px,transparent 1.25px);background-size:16px 16px}
.sheet-in{max-width:520px;margin:0 auto;padding:14px 14px 0;min-height:100%;display:flex;flex-direction:column}
.sheet-in .grow{flex:1}

/* discussion: suspect cards */
.suspects{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.suspect{background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:var(--sh-s);padding:10px;min-height:74px;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:var(--ink);transition:transform .1s ease}
.suspect .top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.speaks{font-family:var(--f-mono);font-size:10.5px;font-weight:800;background:var(--ink);color:#fff;padding:2px 7px;border-radius:999px;white-space:nowrap}
.suspect .mark{font-family:var(--f-mono);font-size:11px;font-weight:800}
.suspect .nm{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;min-width:0}
.suspect .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suspect.sel{background:var(--red-l);box-shadow:var(--sh);transform:translate(-2px,-2px);animation:wiggle .3s}
.suspect.out{opacity:.45;background:var(--bg2);text-decoration:line-through;box-shadow:none}
.suspect.leave{animation:shrinkout .25s ease-in forwards}

/* kick result */
.stampcard{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:var(--sh-l);padding:16px;text-align:center;margin-bottom:12px;animation:slam .38s var(--spring) both}
@keyframes slam{0%{transform:scale(1.25) rotate(3deg);opacity:0}100%{transform:none;opacity:1}}
.stampcard .kname{font-family:var(--f-disp);font-weight:800;font-size:28px;text-transform:uppercase;margin:4px 0;word-break:break-word}
.rstamp{display:inline-block;margin:6px 0;padding:8px 18px;font-family:var(--f-disp);font-weight:800;font-size:24px;text-transform:uppercase;border:3px solid var(--ink);border-radius:8px;box-shadow:var(--sh-s);color:#fff;text-shadow:1.5px 1.5px 0 var(--ink);transform:rotate(-3deg);animation:stamp .42s var(--spring) both}
.rstamp.civ{background:var(--green)}.rstamp.und{background:var(--orange)}.rstamp.wht{background:var(--violet)}
@keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-3deg)}70%{opacity:1;transform:scale(.92) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
.status{background:var(--yellow-l);text-align:center}
.status p{font-weight:800;font-size:15px;margin:4px 0 0}

/* game over */
.winner{border:3px solid var(--ink);border-radius:20px;box-shadow:var(--sh-l);padding:16px;text-align:center;color:#fff;margin-bottom:14px}
.winner.civ{background:var(--green)}.winner.imp{background:var(--orange)}
.winner .big{font-family:var(--f-disp);font-weight:800;font-size:32px;text-transform:uppercase;line-height:1;text-shadow:2px 2px 0 var(--ink)}
.winner p{font-weight:800;margin:6px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--ink);color:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:var(--sh-s);padding:10px;text-align:center}
.tile small{display:block;font-family:var(--f-mono);font-size:10px;color:#bbb}
.tile b{display:block;font-family:var(--f-disp);font-weight:800;font-size:19px;color:var(--yellow);text-transform:uppercase;margin-top:4px;word-break:break-word}
.srow{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:var(--sh-s);padding:6px 8px;margin-bottom:8px}
.srow .pname{font-size:15px}
.rchip{font-family:var(--f-mono);font-size:10px;font-weight:800;padding:3px 8px;border:2px solid var(--ink);border-radius:999px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.rchip.civ{background:var(--green-l)}.rchip.und{background:var(--orange-l)}.rchip.wht{background:var(--violet-l)}
.srow.dead .pname{text-decoration:line-through;color:var(--mute)}
@media (max-width:360px){.poster h1{font-size:38px}.pass .who{font-size:32px}.suspects{gap:8px}}


.winner.wht{background:var(--violet)}
.wscene{position:fixed;inset:0;z-index:30;overflow:auto;color:#fff;background:radial-gradient(circle at 50% 15%,rgba(255,214,0,.55) 0,rgba(255,214,0,.12) 14%,rgba(18,18,18,0) 34%),#121212;animation:fade .2s}
.wscene-in{max-width:520px;min-height:100%;margin:0 auto;padding:22px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center}
.spot{margin-top:22px;animation:spotin .7s var(--spring) both}
@keyframes spotin{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.spot .av{box-shadow:0 0 0 6px var(--yellow),0 0 40px 14px rgba(255,214,0,.6)}
.caught{font-family:var(--f-disp);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;color:var(--yellow);text-shadow:3px 3px 0 var(--orange);margin:18px 0 6px;animation:stamp .45s .55s var(--spring) both}
.wscene .nm{font-family:var(--f-disp);font-weight:800;font-size:26px;text-transform:uppercase;margin:4px 0}
.wsub{font-weight:700;margin:4px 0 18px;text-shadow:0 2px 6px #000}
.wscene .q{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--yellow);padding:14px;margin-top:auto;width:100%;text-align:left;animation:rise .35s 1s both}
.wscene .q h2{color:var(--ink);font-size:13px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;animation:flash .5s ease-out forwards;z-index:31}
@keyframes flash{from{opacity:.9}to{opacity:0}}

.av.xs{width:22px;height:22px;font-size:11px;border-width:2px}
.ctable-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.ctable{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.ctable th{font-family:var(--f-mono);font-size:11px;font-weight:800;text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink);white-space:nowrap;color:var(--mute)}
.ctable td{padding:7px 8px;border-bottom:1px dashed var(--line);font-weight:700;min-width:70px;max-width:130px;word-break:break-word;vertical-align:middle}
.ctable td.who,.ctable th:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:0;max-width:none}
.ctable td.who{white-space:nowrap}
.ctable .cw{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.ctable .cn{max-width:84px;overflow:hidden;text-overflow:ellipsis}
.ctable td.who .tag{margin-left:4px;font-size:9px;padding:1px 6px}
.ctable .now{background:var(--yellow-l)}
.ctable th.now{color:var(--ink)}
.ctable td.empty{color:#b9b2a2}
.ctable tr.out td{opacity:.55}
.ctable tr.out td.who{opacity:1}.ctable tr.out .cn{text-decoration:line-through;color:var(--mute)}
.vbars{display:flex;flex-direction:column;gap:10px}
.vrow{background:#fff;border:2px solid var(--ink);border-radius:12px;box-shadow:var(--sh-s);padding:8px 10px}
.vrow.out{background:var(--red-l)}
.vtop{display:flex;align-items:center;gap:8px}
.vtop b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcount{font-family:var(--f-mono);font-size:12px;font-weight:800;white-space:nowrap}
.vbar{height:12px;background:var(--bg2);border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin:7px 0}
.vbar i{display:block;height:100%;background:var(--orange);animation:grow .7s var(--snap) both;transform-origin:left}
.vrow.out .vbar i{background:var(--red)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.voters{display:flex;flex-wrap:wrap;gap:5px}
.vchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;background:var(--bg);border:1.5px solid var(--ink);border-radius:999px;padding:2px 8px 2px 2px;animation:popin .3s var(--spring) both}
.vprog{height:10px;background:var(--bg2);border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin-bottom:10px}
.vprog i{display:block;height:100%;background:var(--green);transition:width .3s var(--snap)}
.vstat{display:flex;flex-wrap:wrap;gap:6px}
.vs{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:2px 9px 2px 2px}
.vs b{font-size:13px}
.vs.yes{background:var(--green-l)}.vs.yes b{color:var(--green)}
.vs.no{background:#fff;border-style:dashed;color:var(--mute)}.vs.no b{animation:pulse 1.2s ease-in-out infinite}
.wtimer{font-family:var(--f-mono);font-weight:800;font-size:30px;color:var(--yellow);margin:2px 0 14px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

        var nm = (addIn.value.trim() || nextDefault()).slice(0, 14);
        if (taken(nm, -1)) return toast('That name is already used');
        R.push({ name: nm, score: 0 }); justAdded = R.length - 1; addIn.value = ''; saveSolo(); refresh(); justAdded = -1;
      }
      addIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') addP(); });
      function removeAt(i, row) {
        if (busy) return; busy = true;
        row.classList.add('leave');
        later(function () { busy = false; R.splice(i, 1); saveSolo(); refresh(); }, 220);
      }
      function startDrag(e, i) {
        if (R.length < 2 || busy) return;
        e.preventDefault();
        var hdl = e.currentTarget, rows = [].slice.call(list.querySelectorAll('.rrow'));
        var rects = rows.map(function (r) { return r.getBoundingClientRect(); });
        var y0 = e.clientY, drag = rows[i], step = rows.length > 1 ? (rects[Math.min(1, rows.length - 1)].top - rects[0].top) || rects[i].height : rects[i].height, target = i;
        drag.classList.add('dragging'); buzz(15);
        try { hdl.setPointerCapture(e.pointerId); } catch (er) {}
        function mv(ev) {
          var dy = ev.clientY - y0, c = rects[i].top + rects[i].height / 2 + dy, t = i;
          drag.style.transform = 'translateY(' + dy + 'px) scale(1.03)';
          for (var j = 0; j < rows.length; j++) {
            if (j === i) continue;
            var mid = rects[j].top + rects[j].height / 2;
            if (j < i && c < mid) t = Math.min(t, j);
            if (j > i && c > mid) t = Math.max(t, j);
          }
          if (t !== target) buzz(8);
          target = t;
          rows.forEach(function (r, j) {
            if (j === i) return;
            var sh = (i < t && j > i && j <= t) ? -step : (t < i && j >= t && j < i) ? step : 0;
            r.style.transform = sh ? 'translateY(' + sh + 'px)' : '';
          });
        }
        function up() {
          hdl.removeEventListener('pointermove', mv); hdl.removeEventListener('pointerup', up); hdl.removeEventListener('pointercancel', up);
          if (target !== i) { var m = R.splice(i, 1)[0]; R.splice(target, 0, m); saveSolo(); }
          refresh();
        }
        hdl.addEventListener('pointermove', mv); hdl.addEventListener('pointerup', up); hdl.addEventListener('pointercancel', up);
      }
      function paint() {
        var anyScore = R.some(function (r) { return r.score > 0; });
        addIn.placeholder = 'Name (e.g. ' + nextDefault() + ')';
        fill(list, R.length ? R.map(function (r, i) {
          var row = h('div', { class: 'rrow' + (i === justAdded ? ' enter' : '') });
          var handle = h('button', { class: 'handle', type: 'button', 'aria-label': 'Drag to move ' + r.name }, '☰');
          handle.addEventListener('pointerdown', function (e) { startDrag(e, i); });
          add(row, [handle, h('span', { class: 'seatno' }, String(i + 1))]);
          if (editing === i) {
            var done = false, inp = h('input', { type: 'text', maxlength: 14, value: r.name, autocomplete: 'off', class: 'redit' });
            var commit = function () {
              if (done) return; done = true;
              var nm = inp.value.trim().slice(0, 14);
              if (nm && nm !== r.name) { if (taken(nm, i)) toast('That name is already used'); else { r.name = nm; saveSolo(); } }
              editing = -1; paint();
            };
            inp.addEventListener('blur', commit);
            inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') inp.blur(); });
            row.appendChild(inp);
            setTimeout(function () { try { inp.focus(); inp.select(); } catch (e) {} }, 30);
          } else {
            row.appendChild(h('button', { class: 'rname', type: 'button', onclick: function () { editing = i; paint(); } }, r.name));
          }
          if (anyScore) row.appendChild(h('span', { class: 'pts' }, r.score + ' PTS'));
          row.appendChild(h('button', { class: 'rx', type: 'button', 'aria-label': 'Remove ' + r.name, onclick: function () { removeAt(i, row); } }, '✕'));
          return row;
        }) : h('p', { class: 'mute center' }, 'No players yet. Add at least 3.'));
      }
      function refresh() {
        var e = checkSetup(), n = R.length;
        paint(); uS.set(cfg.u); wS.set(cfg.w);
        fill(info, n + ' players → ' + Math.max(0, n - cfg.u - cfg.w) + ' Civilian · ' + cfg.u + ' Undercover · ' + cfg.w + ' Mr. White');
        fill(autoRow, cfg.manual ? h('button', { class: 'link', type: 'button', onclick: function () { cfg.manual = false; refresh(); } }, 'Set roles automatically') : null);
        fill(err, e || ''); start.disabled = !!e; saveSolo();
      }
      var node = h('div', null,
        h('h1', null, 'Seating circle'),
        h('p', { class: 'sub' }, 'Drag ☰ into the order you sit. Tap a name to edit it.'),
        h('div', { class: 'addrow' }, addIn, h('button', { class: 'btn yellow', type: 'button', onclick: addP }, '+ Add')),
        h('div', { class: 'gap' }),
        list,
        h('div', { class: 'tools' },
          h('button', { class: 'btn small', type: 'button', onclick: function () { if (R.length < 2) return; L.roster = R = shuf(R); saveSolo(); refresh(); toast('Seats shuffled'); } }, '🔀 Shuffle'),
          h('button', { class: 'btn small', type: 'button', onclick: function () { if (R.some(function (r) { return r.score; }) && confirm('Reset everyone\'s points to 0?')) { R.forEach(function (r) { r.score = 0; }); refresh(); } } }, 'Reset points'),
          h('button', { class: 'btn small danger', type: 'button', onclick: function () { if (R.length && confirm('Remove all players?')) { R.length = 0; cfg.manual = false; refresh(); } } }, 'Clear all')),
        h('div', { class: 'gap' }),
        h('div', { class: 'roles' },
          h('div', { class: 'role-box' }, h('div', { class: 'lbl' }, 'UNDERCOVER'), uS.root),
          h('div', { class: 'role-box' }, h('div', { class: 'lbl' }, 'MR. WHITE (NO WORD)'), wS.root)), info, autoRow,
        err, dock(start));
      refresh(); return node;
    };

    /* ---- round start: BOL BHAI ticker picks the first player; order goes clockwise from them ---- */
    views.spin = function () {
      var P = L.players, n = P.length, s = L.starter, order = seatOrder();
      var slot = h('div', { class: 'slot' }, 'Spinning…'), stampEl = h('div', { class: 'bol' }, 'BOL BHAI! #1');
      var chips = h('div'), goBtn = h('button', { class: 'btn primary', type: 'button', disabled: true, onclick: function () { go('reveal'); } }, 'Pass phone to ' + P[s].name + ' →');
      function land() {
        fill(slot, P[s].name); slot.classList.remove('tick'); stampEl.classList.add('on');
        fill(chips, h('h2', null, 'Clockwise order from ' + P[s].name), h('p', { class: 'mute small' }, 'Word viewing AND clue giving follow this order.'), orderChips(order, 0));
        goBtn.disabled = false; buzz(140);
      }
      if (RM) land();
      else {
        var total = 2 * n + s, k = 0;
        (function stepFn() {
          if (k >= total) return land();
          fill(slot, P[k % n].name); slot.classList.remove('tick'); void slot.offsetWidth; slot.classList.add('tick'); k++;
          timers.push(setTimeout(stepFn, 55 + 300 * Math.pow(k / total, 2.4)));
        })();
      }
      return h('div', null, h('h1', null, 'Round start'),
        h('p', { class: 'sub' }, 'Who starts the circle?'),
        h('div', { class: 'roulette' }, h('div', { class: 'cap' }, 'FIRST PLAYER TO PEEK & SPEAK'), slot, stampEl), chips, dock(goBtn));
    };

    /* ---- word viewing: hand the phone along the circle; each player holds to peek ---- */
    views.reveal = function () {
      var P = L.players, order = seatOrder(), n = P.length;
      var pos = 0; while (pos < n && P[order[pos]].seen) pos++;
      if (pos >= n) { L.step = 'play'; saveSolo(); return views.play(); }
      var p = P[order[pos]], next = pos + 1 < n ? P[order[pos + 1]] : null;
      return h('div', null,
        h('div', { class: 'row', style: 'justify-content:space-between' }, h('h1', null, 'Secret word pass'), h('span', { class: 'pill', style: 'flex:none' }, (pos + 1) + ' OF ' + n)),
        passAndPeek(p, {
          top: h('div', null, h('h2', null, 'Clockwise circle progress'), orderChips(order, pos, { done: true })),
          extra: h('div', { class: 'center' }, h('button', { class: 'link', type: 'button', onclick: function () { if (confirm('Skip the rest and start the discussion?')) go('play'); } }, 'Someone not here? Skip to discussion')),
          doneText: next ? 'Done — hand to ' + next.name + ' →' : 'All done — start clues & discussion →',
          onDone: function () { p.seen = true; saveSolo(); draw(); window.scrollTo(0, 0); }
        }));
    };

    /* ---- discussion: speaking order + tap suspects to kick ---- */
    views.play = function () {
      var sel = {}, P = L.players, order = seatOrder(), firstAlive = -1;
      var alive = order.filter(function (i) { return P[i].alive; });
      var btn = h('button', { class: 'btn danger', type: 'button', disabled: true, onclick: kick }, 'Select suspect(s) to kick'), cards = {};
      function picked() { return alive.filter(function (i) { return sel[i]; }); }
      function setBtn() {
        var ids = picked(); btn.disabled = !ids.length;
        fill(btn, ids.length ? 'Kick out ' + ids.map(function (i) { return P[i].name; }).join(' & ') + ' (' + ids.length + ') →' : 'Select suspect(s) to kick');
      }
      var speak = 0;
      var grid = h('div', { class: 'suspects' }, order.map(function (i) {
        var p = P[i];
        if (!p.alive) return h('div', { class: 'suspect out' }, h('div', { class: 'top' }, h('span', { class: 'speaks' }, 'OUT'), roleTag(p.role)), h('div', { class: 'nm' }, h('span', null, p.name)));
        speak++; if (firstAlive < 0) firstAlive = i;
        var mark = h('span', { class: 'mark' }, '☐ VOTE');
        var el = h('button', { class: 'suspect', type: 'button', onclick: function () {
          sel[i] = !sel[i]; el.classList.toggle('sel', sel[i]); fill(mark, sel[i] ? '☑ KICK' : '☐ VOTE'); buzz(10); setBtn();
        } }, h('div', { class: 'top' }, h('span', { class: 'speaks' }, 'SPEAKS #' + speak), mark), h('div', { class: 'nm' }, avatar(p.name, i, 'sm'), h('span', null, p.name)));
        cards[i] = el; return el;
      }));
      function kick() {
        var ids = picked();
        if (!ids.length) return;
        if (ids.length >= alive.length) return toast('At least one player has to stay');
        if (!confirm('Kick out ' + ids.map(function (i) { return P[i].name; }).join(', ') + '?')) return;
        btn.disabled = true;
        ids.forEach(function (i) { P[i].alive = false; cards[i].classList.add('leave'); });
        L.last = { ids: ids, shown: false };
        later(function () { go('result'); }, 260);
      }
      function forgot() {
        var sheet = h('div', { class: 'sheet' });
        function close() { if (sheet.parentNode) sheet.parentNode.removeChild(sheet); }
        fill(sheet, h('div', { class: 'sheet-in' }, h('h1', null, 'Forgot your word?'), h('p', { class: 'sub' }, 'Tap your own name.'),
          h('div', { class: 'suspects' }, alive.map(function (i) {
            return h('button', { class: 'suspect', type: 'button', onclick: function () {
              fill(sheet, h('div', { class: 'sheet-in' }, passAndPeek(P[i], { doneText: 'Done — back to discussion', onDone: close })));
            } }, h('div', { class: 'nm' }, avatar(P[i].name, i, 'sm'), h('span', null, P[i].name)));
          })), h('div', { class: 'grow' }), dock(h('button', { class: 'btn yellow', type: 'button', onclick: close }, 'Cancel'))));
        root.appendChild(sheet);
      }
      return h('div', null,
        h('div', { class: 'row', style: 'justify-content:space-between' }, h('h1', null, 'Clues & vote'), h('span', { class: 'pill', style: 'flex:none' }, alive.length + ' ALIVE')),
        h('div', { class: 'card tight', style: 'background:var(--yellow-l)' }, h('h2', null, 'Speaking order (one clue each)'), orderChips(order, order.indexOf(firstAlive), { flat: true, out: true })),
        h('h2', null, 'Tap one or more suspects to kick out'),
        grid,
        h('button', { class: 'link', type: 'button', onclick: forgot }, 'Forgot your word? Check it'),
        dock(btn));
    };

    /* ---- kick result: role stamp only (word stays secret) ---- */
    /* Mr. White caught: spotlight scene; he says his guess out loud and the group taps Yes / No */
    function whiteScene(i) {
      var p = L.players[i], g = L.last.guess;
      later(function () { buzz([60, 40, 60, 40, 200]); }, 100);
      function answer(yes) {
        if (yes && !confirm(p.name + ' guessed the word correctly? Mr. White wins this round.')) return;

        if (yes) { L.winner = 'white'; scoreGame(); return go('over'); }
        draw(); window.scrollTo(0, 0);
      }
      return h('div', { class: 'wscene' }, RM ? null : h('div', { class: 'flash' }),
        h('div', { class: 'wscene-in' },
          h('span', { class: 'pill ink', style: 'background:var(--yellow);color:var(--ink)' }, 'VERDICT'),
          h('div', { class: 'spot' }, avatar(p.name, i, 'xl')),
          h('div', { class: 'caught' }, 'Mr. White pakda gaya!'),
          h('div', { class: 'nm' }, p.name),
          h('p', { class: 'wsub' }, 'Ek last chance, ' + p.name + '! Say the civilians\' word out loud. 🎤'),
          h('div', { class: 'q' }, h('h2', null, 'Did ' + p.name + ' guess the word?'),
            h('p', { class: 'mute small', style: 'margin:4px 0 0' }, 'Civilians decide. If yes, Mr. White wins and the round ends.'),
            h('div', { class: 'yn' },
              h('button', { class: 'btn green', type: 'button', onclick: function () { answer(true); } }, '✓ Yes'),
              h('button', { class: 'btn danger', type: 'button', onclick: function () { answer(false); } }, '✗ No')))));
    }

    views.result = function () {
      var ids = L.last.ids, P = L.players;

      if (pendingWhite.length) return whiteScene(pendingWhite[0]);

        if (w) { L.winner = w; scoreGame(); return go('over'); }
        go('play');
      } }, w ? 'See scoreboard & words →' : 'Next clue & vote round →');
      var status = w === 'civilians' ? 'All the Undercover & Mr. White players have been caught!'
        : w === 'impostors' ? 'The impostors (' + c.imp + ') now equal or outnumber the civilians (' + c.civ + ')!'
        : c.imp + ' impostor' + (c.imp === 1 ? '' : 's') + ' still hiding among ' + c.civ + ' civilians!';
      return h('div', { class: first ? '' : 'still' },
        h('h1', null, 'Verdict'), h('div', { class: 'gap' }),

            h('div', { class: 'rstamp ' + rcls(p.role), style: 'animation-delay:' + (0.3 + k * 0.35) + 's' }, roleLabel(p.role)),
            p.role === 'white' && L.last.guess[i] === false ? h('p', { style: 'font-weight:800;margin:4px 0' }, 'Guessed the word? ✗ No') : null,
            h('p', { class: 'mute small' }, 'The word stays secret until the game ends.'));

    };

    /* ---- game over: winner, both words, roles, scoreboard ---- */
    views.over = function () {
      var w = L.winner, key = L.pair.civilian + '|' + L.pair.undercover + '|' + w;
      if (!celebrated[key]) { celebrated[key] = 1; later(confetti, 150); buzz([80, 50, 80]); }
      return h('div', null,
        h('div', { class: 'winner bounce ' + (w === 'civilians' ? 'civ' : w === 'white' ? 'wht' : 'imp') }, h('div', { class: 'big' }, w === 'civilians' ? 'Civilians win!' : w === 'white' ? 'Mr. White wins!' : 'Impostors win!'),
          h('p', null, w === 'civilians' ? 'Every impostor was kicked out of the tapri! +2 each' : w === 'white' ? 'Caught, but guessed the word! +6' : 'The impostors took over the adda! +4 each')),
        h('h2', null, 'The secret word pair'),

        h('h2', null, 'Everyone\'s role & scoreboard'),
        L.players.map(function (p, i) {

            h('span', { class: 'rchip ' + rcls(p.role) }, roleLabel(p.role).toUpperCase() + (p.role === 'white' ? '' : ' · ' + p.word)), pts);
        }),
        dock(h('button', { class: 'btn primary', type: 'button', onclick: function () { dealRoles(); go('spin'); } }, 'Play next round (new words) →'),
          h('div', { class: 'gap' }),
          h('button', { class: 'btn yellow', type: 'button', onclick: function () { go('roster'); } }, 'Edit players / seating')));
    };

    if (L.step === 'over') celebrated[L.pair.civilian + '|' + L.pair.undercover + '|' + L.winner] = 1; // no confetti again after a refresh
    draw();
    return { root: root, update: function () {} };
  };

  /* ---------- render loop ---------- */
  var app = document.getElementById('app'), cur = null, curKey = null;
  function keyFor() {
    if (!S) return mode === 'menu' ? 'menu' : mode === 'solo' ? 'solo' : 'home';
    if (S.phase === 'lobby') return S.me.host ? 'lobby-host' : 'lobby';
    return S.phase;
  }
  function render() {
    renderHeader();
    var key = keyFor();
    if (key !== curKey) {
      curKey = key; clear(app);
      cur = (key === 'home' ? screens.home : key.indexOf('lobby') === 0 ? screens.lobby : screens[key])();
      app.appendChild(cur.root);
      window.scrollTo(0, 0);
    }
    if (S && S.phase !== 'lobby' && S.phase !== 'over') wakeLock();
    cur.update();
  }
  setInterval(function () { if (cur && cur.tick) cur.tick(); }, 250);

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    try {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (!e.data || e.data.t !== 'updated' || document.querySelector('.update')) return;
        document.body.appendChild(h('div', { class: 'update' }, 'New version ready', h('button', { class: 'btn primary', type: 'button', onclick: function () { location.reload(); } }, 'Reload')));
      });
    } catch (e) {}
  }

  render();
  connect();
})();
</script>
